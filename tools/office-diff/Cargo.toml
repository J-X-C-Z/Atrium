[package]
name = "office-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Renders an Office corpus with LibreOffice and Atrium's layout engine, compares the pages and writes an HTML report."

[[bin]]
name = "office-diff"
path = "src/main.rs"

[dependencies]
atrium-layout = { path = "../../crates/atrium-layout" }
atrium-office = { path = "../../crates/atrium-office" }
atrium-preview = { path = "../../crates/atrium-preview" }
anyhow.workspace = true
fontdb = "0.23"
hayro = "0.9"
jiff.workspace = true
png = "0.18"
rustybuzz = "0.20"
serde.workspace = true
serde_json.workspace = true
tiny-skia = "0.12"
ttf-parser = "0.25"
