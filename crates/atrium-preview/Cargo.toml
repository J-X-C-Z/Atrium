[package]
name = "atrium-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "File previews for Atrium's side panel: Word, PowerPoint and PDF as page images, spreadsheets and CSV as cell grids."

[dependencies]
calamine = { version = "0.38", features = ["dates"] }
csv = { version = "1.4.0", default-features = false }
encoding_rs = { version = "0.8.44", default-features = false }
hayro = "0.9"
office2pdf = { version = "0.11", default-features = false }
png = { version = "0.18.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
zip = { version = "9", default-features = false }

[dev-dependencies]
png = { version = "0.18.1", default-features = false }
