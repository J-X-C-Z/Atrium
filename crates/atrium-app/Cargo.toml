[package]
name = "atrium-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "atrium"
path = "src/main.rs"

[dependencies]
atrium-core.workspace = true
atrium-node.workspace = true
atrium-sync.workspace = true
atrium-phone = { path = "../atrium-phone" }
atrium-project.workspace = true
atrium-runtime.workspace = true
atrium-office.workspace = true
atrium-layout.workspace = true
atrium-workflow.workspace = true
atrium-memory.workspace = true
atrium-team.workspace = true
atrium-preview.workspace = true
codex-client.workspace = true
acp-client.workspace = true
agent-rpc.workspace = true
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
log.workspace = true
env_logger.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
dirs.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
gpui.workspace = true
gpui-kit.workspace = true
ely-gpui-component.workspace = true
# Only for screenshot runs: the window's own renderer needs the platform's
# test-support feature to expose `render_to_image`.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", optional = true }

[features]
workspace-ticker-test = ["gpui/test-support", "atrium-phone/test-support"]
# Renders the window to a PNG for screenshot runs (script/screenshot-chat-list.sh).
screenshots = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
tempfile = "3"
ureq.workspace = true
