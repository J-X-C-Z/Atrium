id = "mathmodel"
name = "数学建模竞赛"
description = "从赛题到论文：读题建模、编程求解出图、画流程图、用 LaTeX 写论文、按竞赛规则验收，最后按评分标准自评。适用于国赛、华为杯、美赛等。"
version = 1

preamble = """
你在参加数学建模竞赛（{{input.contest}}），论文语言：{{input.language}}。赛题和附件在：{{input.problem}}。
当前文件夹就是这次比赛的工作目录，各步骤约定的位置如下：
- `plan.md`：整体方案和决策记录；`reports/`：各阶段报告；`code/`：全部程序；`results/`：计算结果；`figures/`：全部图（PDF 优先）；`paper/`：论文源文件和 PDF。

所有步骤都要遵守：
- 不编造数值、数据、文献或结论。论文里的每个数都要能在 `results/` 或 `reports/RESULTS_REPORT.md` 里找到出处。
- 用到的公开资料（论文、网页、数据、代码）都记在 `reports/SOURCE_LEDGER.md`，写明作者或机构、题名、出处或网址、访问日期、用在哪里；核实不了的标「待补证」。
- 论文、代码、图里不出现队员姓名、学校、队号、邮箱、带用户名的绝对路径等身份信息。
- 只做当前步骤的事，前面步骤的产出有问题就写进你的报告，不要悄悄改掉别人的结论。

用户的补充要求（可能为空）：{{input.notes}}
"""

[[inputs]]
key = "problem"
label = "赛题"
help = "题目 PDF 和附件数据，一起拖进来。"
kind = "files"
required = true

[[inputs]]
key = "contest"
label = "竞赛"
kind = "choice"
options = ["CUMCM", "华为杯", "MCM/ICM", "其他"]
help = "CUMCM 是全国大学生数学建模竞赛（国赛），MCM/ICM 是美赛。"

[[inputs]]
key = "language"
label = "论文语言"
kind = "choice"
options = ["中文", "English"]
help = "美赛要用英文。"

[[inputs]]
key = "status"
label = "论文状态"
kind = "choice"
options = ["草稿", "提交"]
help = "提交状态下，承诺书和编号专用页必须是官方的页面，验收会更严格。"
when = "contest=CUMCM"

[[inputs]]
key = "notes"
label = "你的想法"
kind = "long"
help = "可选：想用的模型、重点、已有的思路或限制。"

[[inputs]]
key = "identity"
label = "需要匿名的信息"
kind = "long"
private = true
help = "队员姓名、学校、队号等，每行一个。只用来检查论文和代码里有没有出现，不会发给 agent。"

[defaults]
effort = "high"
attempts = 2
timeout_min = 120



[[steps]]
id = "analysis"
title = "读题与建模方案"
summary = "拆解子问题，定假设、变量、目标和约束，选模型和求解路线"
agent = "claude"
skill = "mathmodel-contest-suite:2analysis-modeling"
prompt = """
仔细读题和全部附件，完成赛题分析与建模设计：

1. 拆解子问题。每个子问题写清：已知条件和数据、要求的对象（决策变量或预测目标）、目标函数或评价指标、约束、和其他子问题的关系、准备用什么图表展示结果。
2. 找出题目里有歧义的表述，列出可能的理解，用快速估算比较，选定一种并说明理由。
3. 理解数据：规模、字段含义、缺失和异常、单位，需要派生哪些指标。
4. 给每个子问题定模型：符号与变量、假设（每条都要能说清必要性）、目标函数、约束、求解方法、预期输出、结果怎么检验。至少说明一个备选模型和不选它的原因。
5. 写 `plan.md`：总体技术路线、每个子问题的模型、各阶段的产物和风险。

把以上写成 `reports/ANALYSIS_MODELING_REPORT.md`，并建立 `reports/SOURCE_LEDGER.md`（没用到公开资料也要写明核查结论）。
"""
outputs = ["reports/ANALYSIS_MODELING_REPORT.md", "reports/SOURCE_LEDGER.md", "plan.md"]
checks = [
  { kind = "contains", path = "reports/ANALYSIS_MODELING_REPORT.md", pattern = "(问题|Problem|Question)\\s*[一二三四五六1-6]", message = "建模报告按子问题分别给出了模型" },
  { kind = "contains", path = "reports/ANALYSIS_MODELING_REPORT.md", pattern = "假设|[Aa]ssumption", message = "建模报告写了模型假设" },
]
gate = true

[[steps]]
id = "coding"
title = "编程求解与数据图"
summary = "实现模型、跑出结果、画论文用的数据图，记录可复现的运行方式"
agent = "codex"
skill = "mathmodel-contest-suite:3coding-visual"
prompt = """
按 `reports/ANALYSIS_MODELING_REPORT.md` 和 `plan.md` 实现全部模型：

1. 每个子问题一个程序（如 `code/problem1.py`），公共部分放 `code/utils.py`；提供一个统一入口 `code/run_all.py`，从原始数据一路跑到全部结果和图。固定随机种子，记录依赖和版本（`code/requirements.txt` 或同等文件）。
2. 真正运行它，把结果表写进 `results/`（CSV 或 JSON），把关键数值、运行命令、用时和退出状态写进 `reports/RESULTS_REPORT.md`。
3. 画论文用的数据图到 `figures/`（矢量 PDF 优先）：每张图先想清楚它要证明哪句结论，再选图型；配色统一、色盲友好，字号在缩放到正文宽度后仍清晰。流程图、技术路线图这类非数据图不归这一步。
4. 做模型检验和灵敏度分析，结果和图同样放进 `results/`、`figures/`，并写进报告。
5. 写 `reports/SUPPORTING_MATERIALS_MANIFEST.md`：每个程序的用途、运行方式、输入输出、对应哪个问题、结果在论文哪里用到。

不要修改建模结论；发现模型跑不通或结果明显不合理，在报告里写清楚原因和你的处理。
"""
outputs = ["code/run_all.py", "results", "reports/RESULTS_REPORT.md", "reports/SUPPORTING_MATERIALS_MANIFEST.md"]
checks = [
  { kind = "exists", path = "figures/*.pdf", min = 3 },
  { kind = "contains", path = "reports/RESULTS_REPORT.md", pattern = "灵敏度|敏感性|[Ss]ensitivity", message = "结果报告包含灵敏度分析" },
  { kind = "absent", path = "code", input = "identity", message = "代码里没有身份信息" },
]
timeout_min = 180

[[steps]]
id = "diagrams"
title = "流程图与技术路线图"
summary = "画技术路线、算法流程等非数据图"
agent = "claude"
skill = "mathmodel-contest-suite:4drawio"
optional = true
prompt = """
为论文画必要的非数据图：总体技术路线图（`figures/fig_roadmap`），以及确有需要的子问题求解流程图、数据处理流程或指标体系图。
用 draw.io 格式保存源文件（`figures/*.drawio`），并导出为 PDF；导不出 PDF 时，在报告里说明。节点文字简短，样式统一，箭头不交叉，文字语言和论文一致。
不要重画已有的数据图。把每张图的用途和打算放在论文哪一节写进 `reports/DRAWIO_REPORT.md`。
"""
outputs = ["figures/*.drawio", "reports/DRAWIO_REPORT.md"]

[[steps]]
id = "writing"
title = "撰写论文（LaTeX）"
summary = "按竞赛格式写完整论文并编译成 PDF"
agent = "claude"
skill = "mathmodel-contest-suite:5writing"
needs = ["coding", "diagrams"]
prompt = """
用 LaTeX 写完整的竞赛论文，放在 `paper/`：入口 `paper/main.tex`，各节放在 `paper/sections/`，用 XeLaTeX 编译（跑两遍以解决交叉引用），得到 `paper/main.pdf`。

结构：摘要（最后写）、问题重述、问题分析、模型假设、符号说明、各问题的模型建立与求解（每个问题一节）、模型检验与灵敏度分析、模型评价与推广、参考文献、附录（支撑材料清单和完整程序）。

要求：
- 只用 `reports/` 和 `results/` 里的结论和数值；图从 `figures/` 引用，每张图表都有编号、题注，并在正文里引用和解释。
- 公式里的每个符号在符号说明或首次出现处解释。
- 参考文献和 `reports/SOURCE_LEDGER.md` 一致，每条都在正文中被引用。
- 摘要要写清每个问题用了什么方法、得到了什么具体结果。
- 不要留下 TODO、待补充之类的占位文字。

竞赛的格式规则：
- CUMCM（国赛）：A4，页边距不小于 2.5 cm；不要目录；前两页为承诺书和编号专用页（草稿阶段放占位页，不要自己编写它们的内容），第 3 页是只有一页的中文摘要，页码从摘要页开始为 1 并连续；正文加参考文献控制在 30 页以内，最好 27–29 页；全文匿名。
- MCM/ICM（美赛）：英文，第一页是 Summary Sheet，全文不超过 25 页。
- 其他竞赛：按题目文件里的格式要求。
"""
outputs = ["paper/main.tex", "paper/main.pdf"]
checks = [
  { kind = "command", run = "xelatex -interaction=nonstopmode -halt-on-error main.tex && xelatex -interaction=nonstopmode -halt-on-error main.tex", cwd = "paper", timeout_min = 10, message = "论文能用 XeLaTeX 编译通过" },
  { kind = "absent", path = "paper", pattern = "TODO|PLACEHOLDER|待补充|待续写|示例数据|\\?\\?", message = "论文里没有占位文字或未解析的引用" },
  { kind = "absent", path = "paper", input = "identity", message = "论文里没有身份信息" },
  { kind = "absent", path = "paper/main.tex", pattern = "\\\\tableofcontents", message = "国赛论文没有目录", when = "contest=CUMCM" },
  { kind = "pdf_pages", path = "paper/main.pdf", max = 25, when = "contest=MCM/ICM" },
]
timeout_min = 180

[[steps]]
id = "verify"
title = "验收"
summary = "按竞赛规则逐项检查论文、结果和程序，发现问题退回写作"
agent = "claude"
skill = "mathmodel-contest-suite:6verity"
fixes = "writing"
attempts = 3
prompt = """
对照竞赛规则和前面各阶段的产物，逐项验收（只检查和记录，小的笔误可以直接改，涉及内容的问题交回写作步骤）：

1. 结构：章节齐全、顺序正确，子问题数量和建模报告一致。
2. 图表：每张引用的图都存在，每张图表都在正文里被引用并有解释，题注贴切。
3. 数值一致：论文里的关键数值逐个和 `results/`、`reports/RESULTS_REPORT.md` 核对。
4. 可复现：运行 `code/run_all.py`（耗时太长时运行其中能在合理时间内完成的部分），确认能跑通、关键结果一致。
5. 引用：正文引用、参考文献和来源台账三者一致。
6. 格式：按 `{{input.contest}}` 的规则检查页数、目录、页码、摘要页、页边距；国赛的论文状态是「{{input.status}}」，提交状态下官方页面必须已替换占位页。
7. 写作：没有占位文字、没有正文里暴露内部文件名或路径、没有只报数不解释的地方。

写 `reports/VERIFY_REPORT.md`：逐项列出检查结果和发现的问题（每个问题写明位置和改法），最后单独一行写结论：`结论：通过` 或 `结论：未通过`。只要还有会影响得分或违反规则的问题，就写未通过。
"""
outputs = ["reports/VERIFY_REPORT.md"]
checks = [
  { kind = "contains", path = "reports/VERIFY_REPORT.md", pattern = "结论[:：]\\s*通过", message = "验收结论为通过（未通过的问题清单见 reports/VERIFY_REPORT.md，请逐条修正）" },
]
gate = true

[[steps]]
id = "review"
title = "按评分标准自评"
summary = "像评委一样打分，给出最该改的地方"
agent = "claude"
skill = "mathmodel-contest-suite:bzd-review-paper"
optional = true
prompt = """
像这项竞赛的评委一样审阅 `paper/main.pdf`：先根据题目定出评分要点（每个问题的关键点、模型合理性、结果正确性、检验与灵敏度、摘要质量、写作与格式），再逐项打分并说明依据，给出总评和最值得优先修改的五处（每处写清位置和改法）。
不要声称官方奖项或确切名次。写入 `reports/REVIEW.md`。
"""
outputs = ["reports/REVIEW.md"]
