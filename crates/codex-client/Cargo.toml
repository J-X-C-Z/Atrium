[package]
name = "codex-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Drives `codex app-server` over stdio JSON-RPC and translates its protocol into AgentDesk events."

[dependencies]
agentdesk-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
log.workspace = true
dirs.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[[bin]]
name = "mock-codex"
path = "src/bin/mock_codex.rs"
