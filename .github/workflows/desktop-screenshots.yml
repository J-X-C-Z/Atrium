name: Desktop screenshots

"on":
  pull_request:
    paths:
      - 'crates/atrium-app/**'
      - 'crates/codex-client/**'
      - 'third_party/ely-gpui-components/**'
      - 'script/screenshot-chat-list.sh'
      - '.github/workflows/desktop-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-list:
    name: Chat list (Xvfb, English and Chinese)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Xvfb, ImageMagick and GPUI's X11 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool imagemagick \
            libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxcb1 \
            libxcb-randr0 libxcb-shape0 libxcb-render0 libxcb-xfixes0 \
            libxcb-xkb1 libxi6 libxrandr2 libxcursor1 libxrender1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Build and capture English and Chinese chat lists
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./script/screenshot-chat-list.sh --linux --output docs/evidence
      - name: Check both screenshots are real images
        run: |
          set -euo pipefail
          for png in docs/evidence/chat-list-en.png docs/evidence/chat-list-zh.png; do
            test -s "$png"
            identify "$png"
          done
      - name: Keep the screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atrium-chat-list-screenshots
          path: docs/evidence/chat-list-*.png
          if-no-files-found: error
          compression-level: 0
