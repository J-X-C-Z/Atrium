name: Native node package acceptance

"on":
  pull_request:
    paths:
      - 'crates/atrium-node/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/node-package.py'
      - 'scripts/node-package-windows.ps1'
      - 'scripts/test_node_package.py'
      - 'scripts/node-portable-load.py'
      - 'scripts/test_node_portable_load.py'
      - '.github/workflows/node-package.yml'
  workflow_dispatch:
    inputs:
      paced-baseline:
        description: Run the two paced macOS performance measurements
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Package safety fixtures
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 -m unittest discover -s scripts -p test_node_package.py -v
          python3 -m unittest discover -s scripts -p test_node_portable_load.py -v
      - name: Native node build, archive, verify, smoke and reproducible repack
        shell: bash
        run: |
          set -euo pipefail
          # Do not cargo fetch the entire GUI workspace. A locked node-only
          # build warms exactly this build graph for the script's offline build.
          job_root="$(mktemp -d "$RUNNER_TEMP/atrium-node-package.XXXXXX")"
          export PACKAGE_JOB_ROOT="$job_root"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo build --locked --release -p atrium-node --bin atrium-node \
            --target "$host" --target-dir "$job_root/target"
          python3 scripts/node-package.py build \
            --output "$job_root/node.tar.gz" --target-dir "$job_root/target"
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("node_package", "scripts/node-package.py")
          package = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(package)
          root = Path(os.environ["PACKAGE_JOB_ROOT"])
          archive = root / "node.tar.gz"
          expected = package.sha(package.read_regular_bounded(archive, package.MAX_BINARY + 1024 * 1024))
          manifest, binary, hashes = package.verify(archive, expected)
          package.make_archive(binary, manifest, root / "repacked.tar.gz")
          _, _, repacked = package.verify(root / "repacked.tar.gz", expected)
          assert repacked == hashes, "same-input archive repack differed"
          print(json.dumps({"manifest": manifest, "hashes": hashes, "repack": "identical"}, indent=2))
          print(json.dumps(package.smoke(archive, expected), indent=2))
          # All runs use this one verified native release archive. Retention
          # profiles are separate correctness cases, not a speed comparison.
          cases = [(f"{n}-{mode}", mode == "small", 2)
                   for n in range(1, 4) for mode in ("default", "small")]
          cases.append(("bounded-60-rounds", True, 60))
          for label, small, rounds in cases:
              result_path = root / f"load-{label}.json"
              command = [sys.executable, "scripts/node-portable-load.py",
                         "--archive", str(archive), "--expected-sha256", expected,
                         "--output", str(result_path), "--rounds", str(rounds)]
              if small:
                  command.append("--small-retention")
              subprocess.run(command, check=True, timeout=210)
              result = json.loads(result_path.read_text())
              assert result["status"] == "completed"
              assert result["hashes"] == hashes
              print(json.dumps({"case": label, **{k: v for k, v in result.items()
                               if k != "samples"}}, indent=2))
          PY
          if [[ '${{ runner.os }}' != 'macOS' || '${{ inputs.paced-baseline }}' != 'true' ]]; then
            exit 0
          fi
          # Same newly built archive, same fixed profile: two current-baseline
          # repeats, not an A/B or an optimization comparison.
          python3 - <<'PYBASELINE'
          import importlib.util, json, os, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("node_package", "scripts/node-package.py")
          package = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(package)
          root = Path(os.environ["PACKAGE_JOB_ROOT"])
          archive = root / "node.tar.gz"
          expected = package.sha(package.read_regular_bounded(archive, package.MAX_BINARY + 1024 * 1024))
          manifest, _, hashes = package.verify(archive, expected)
          assert manifest["source_dirty"] is False
          for repeat in (1, 2):
              output = root / f"paced-{repeat}.json"
              command = [sys.executable, "scripts/node-portable-load.py",
                         "--archive", str(archive), "--expected-sha256", expected,
                         "--output", str(output), "--paced-baseline"]
              try:
                  run = subprocess.run(command, check=False, timeout=210)
              finally:
                  try:
                      result = json.loads(output.read_text())
                  except (OSError, ValueError):
                      result = {}
                  fields = ("status", "hashes", "driver_sha256", "paced_baseline",
                            "wall_seconds", "peak_sampled_node_rss_kib",
                            "peak_sampled_children_rss_kib", "sampled_cpu_single_core_percent")
                  print(json.dumps({"baseline_repeat": repeat, "report_available": bool(result),
                                    **{k: result[k] for k in fields if k in result}}, indent=2),
                        flush=True)
              run.check_returncode()
              assert result["status"] == "completed" and result["hashes"] == hashes
              measured = result["paced_baseline"]
              assert 102.4 <= measured["observed_seconds"] <= 120
              assert measured["scheduled_slots"] == 4096
              assert result["echoes_verified"] == measured["rtt"]["samples"] == measured["send_attempts"]
              assert measured["send_attempts"] + measured["unoffered_slots"] == 4096
              assert all(c["verified_echoes"] >= 1024 for c in measured["clients"])
          PYBASELINE
          # No uploads, service installation, accounts, signing or publication.
          # RUNNER_TEMP is runner-owned and removed by the hosted runner lifecycle.
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build and smoke the packaged Windows node
        shell: pwsh
        run: |
          ./scripts/node-package-windows.ps1 -Output "$env:RUNNER_TEMP/atrium-node-windows-x64.zip"
