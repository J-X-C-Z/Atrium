name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the tag is the workspace version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
              exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create the release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release create "$GITHUB_REF_NAME" --draft \
                  --title "Atrium ${GITHUB_REF_NAME}" --generate-notes
          fi

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Import the Developer ID certificate when provided
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_CERTIFICATE_P12 != null
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/atrium-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "ATRIUM_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "ATRIUM_KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12_b64="$RUNNER_TEMP/atrium-signing.p12.b64"
          p12="$RUNNER_TEMP/atrium-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" > "$p12_b64"
          openssl base64 -d -in "$p12_b64" -out "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
              $(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          rm -f "$p12" "$p12_b64"
      - name: Verify the runner architecture
        run: |
          if [[ "$(uname -m)" != "${{ matrix.arch }}" ]]; then
              echo "Expected ${{ matrix.arch }}, found $(uname -m)" >&2
              exit 1
          fi
      - name: Build DMG and ZIP (signing and notarization follow the secrets)
        run: ./script/bundle-macos.sh --dmg
      - name: Package atrium-node
        run: |
          python3 scripts/node-package.py build \
              --output "dist/atrium-node-${{ needs.prepare.outputs.version }}-macos-$(uname -m).tar.gz" \
              --target-dir "$RUNNER_TEMP/atrium-node-target"
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.tar.gz --clobber
      - name: Remove the signing keychain
        if: always() && env.ATRIUM_KEYCHAIN != '' && env.ATRIUM_KEYCHAIN != null
        run: security delete-keychain "$ATRIUM_KEYCHAIN" || true

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Inno Setup 6
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1).Source
          if (!$iscc) { choco install innosetup --yes --no-progress }
      - name: Build the portable ZIP and per-user installer EXE
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Installer
      - name: Package atrium-node
        shell: pwsh
        run: |
          ./scripts/node-package-windows.ps1 `
              -Output "$env:GITHUB_WORKSPACE/dist/atrium-node-${{ needs.prepare.outputs.version }}-windows-x64.zip"
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" dist/*.exe dist/*.zip --clobber

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Official stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: GPUI build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config desktop-file-utils \
              libc6-dev libfontconfig1-dev libfreetype6-dev \
              libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
              libxcb-shape0-dev libxcb-xkb-dev libxrandr-dev libxi-dev \
              libxcursor-dev libxinerama-dev libvulkan-dev \
              libgbm-dev libdrm-dev libegl1-mesa-dev libgl1-mesa-dev libssl-dev
      - name: Fetch appimagetool
        env:
          APPIMAGETOOL_SHA256: ${{ vars.APPIMAGETOOL_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          curl -fsSL --retry 3 -o dist/tools/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          if [[ -n "${APPIMAGETOOL_SHA256:-}" ]]; then
              echo "${APPIMAGETOOL_SHA256}  dist/tools/appimagetool" | sha256sum -c -
          else
              echo "::warning::APPIMAGETOOL_SHA256 is not set; the downloaded appimagetool is not pinned"
          fi
          chmod +x dist/tools/appimagetool
      - name: Build the AppImage and Debian package
        env:
          APPIMAGETOOL: ${{ github.workspace }}/dist/tools/appimagetool
          APPIMAGETOOL_EXTRACT_AND_RUN: '1'
        run: ./script/bundle-linux.sh
      - name: Package atrium-node
        run: |
          python3 scripts/node-package.py build \
              --output "dist/atrium-node-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz" \
              --target-dir "$RUNNER_TEMP/atrium-node-target"
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*.tar.gz --clobber

  checksums:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download every asset and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p download
          cd download
          gh release download "$GITHUB_REF_NAME" --dir .
          rm -f SHA256SUMS
          sha256sum * | tee SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
