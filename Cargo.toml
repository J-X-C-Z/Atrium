[workspace]
resolver = "3"
exclude = ["third_party"]
members = [
    "crates/atrium-node",
    "crates/atrium-process",
    "crates/atrium-phone",
    "crates/atrium-sync",
    "crates/atrium-core",
    "crates/atrium-runtime",
    "crates/atrium-engine",
    "crates/agent-rpc",
    "crates/codex-client",
    "crates/acp-client",
    "crates/atrium-project",
    "crates/atrium-office",
    "crates/atrium-layout",
    "crates/atrium-preview",
    "crates/atrium-workflow",
    "crates/atrium-memory",
    "crates/atrium-team",
    "crates/atrium-orca-core",
    "crates/atrium-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
jiff = "0.2"
dirs = "6"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

atrium-process = { path = "crates/atrium-process" }
atrium-core = { path = "crates/atrium-core" }
atrium-runtime = { path = "crates/atrium-runtime" }
atrium-engine = { path = "crates/atrium-engine" }
atrium-node = { path = "crates/atrium-node" }
atrium-sync = { path = "crates/atrium-sync" }
codex-client = { path = "crates/codex-client" }
agent-rpc = { path = "crates/agent-rpc" }
acp-client = { path = "crates/acp-client" }
atrium-project = { path = "crates/atrium-project" }
atrium-office = { path = "crates/atrium-office" }
atrium-layout = { path = "crates/atrium-layout" }
atrium-preview = { path = "crates/atrium-preview" }
atrium-memory = { path = "crates/atrium-memory" }
atrium-team = { path = "crates/atrium-team" }
atrium-workflow = { path = "crates/atrium-workflow" }

# UI stack. GPUI Kit 0.7.1 and Ely both pin the gpui-pre 0.3.8 snapshot:
# upgrade all three together, never one alone.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = { version = "=0.7.1" }
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "5d6efd46ec0c93b381ec7578561a1273c366025b" }

# Size-optimised build of the Orca plugin's wasm core (scripts/build-core.sh);
# other crates' dev and release builds are unaffected.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
# Dependencies without debug info: much smaller builds.
debug = false

# Ely with its chat and agent copy localized (see third_party/ely-gpui-components/ATRIUM.md).
[patch."https://github.com/ZacharyZhang-NY/Ely-GPUI-Components"]
ely-gpui-component = { path = "third_party/ely-gpui-components" }
